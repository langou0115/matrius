name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrius-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Require main
        env:
          SELECTED_REF: ${{ github.ref }}
        run: test "$SELECTED_REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish reviewed main commit
        env:
          REMOTE_USER: ${{ vars.REMOTE_USER }}
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_SSH_PORT: ${{ vars.REMOTE_SSH_PORT }}
          APP_PORT: ${{ vars.APP_PORT }}
          API_PORT: ${{ vars.API_PORT }}
          APP_HTTPS_PORT: ${{ vars.APP_HTTPS_PORT }}
          REMOTE_ENV_FILE: ${{ vars.REMOTE_ENV_FILE }}
          REMOTE_WORKSPACE: ${{ vars.REMOTE_WORKSPACE }}
          SSH_PRIVATE_KEY: ${{ secrets.REMOTE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.REMOTE_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work_dir=$(mktemp -d)
          trap 'rm -rf -- "$work_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$work_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$work_dir/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          export REMOTE_SSH_KEY="$work_dir/key"
          export REMOTE_SSH_KNOWN_HOSTS="$work_dir/known_hosts"
          npm run deploy
