<!doctype html><html><head><meta charset="utf-8"><title>编码测试页面</title></head><body><article><h1>中文网页编码测试</h1><p>这是一个使用国标编码保存的中文网页，用来验证服务端在网站错误声明编码时仍然能够正确识别并解码正文内容。</p><p>网页正文应该完整显示中文，而不是出现问号或者替换字符。统计检测需要在没有可靠声明的情况下判断出实际编码，这对于中文新闻站点尤其重要。</p><p>读者打开页面时应当看到正常的汉字、标点和段落结构，而不是无法阅读的乱码文本。</p></article></body></html>
