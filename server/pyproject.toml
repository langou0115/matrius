[project]
name = "matrius-server"
version = "0.1.0"
description = "Matrius cloud backend"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "charset-normalizer>=3.4",
  "ddgs>=9.16.1,<10",
  "fastapi>=0.115",
  "httpx[socks]>=0.28",
  "lxml>=5.0",
  "openpyxl>=3.1",
  "pydantic-settings>=2.7",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "python-multipart>=0.0.20",
  "python-pptx>=1.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "trafilatura>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# FastAPI's dependency injection idiom is a call in a default argument.
ignore = ["B008"]
