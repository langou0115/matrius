name: matrius-prod

services:
  caddy:
    container_name: matrius-caddy
    image: caddy:2-alpine
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-16666}:80"
      - "${APP_BIND:-0.0.0.0}:${APP_HTTPS_PORT:-8443}:443"
      - "${APP_BIND:-0.0.0.0}:${API_PORT:-16667}:8082"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8099/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - edge
    restart: unless-stopped

  web:
    container_name: matrius-web
    image: matrius-web:local
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8081/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    restart: unless-stopped

  api:
    container_name: matrius-api
    image: matrius-api:local
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        PYPI_INDEX_CANDIDATES: ${PYPI_INDEX_CANDIDATES:-https://pypi.org/simple,https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      APP_ENV: production
      APP_URL: ${APP_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_URL: sqlite+aiosqlite:////data/matrius.db
      DATA_DIR: /data
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-30000}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-10000}
      CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-67108864}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-8}
      SEARCH_DDGS_TIMEOUT_SECONDS: ${SEARCH_DDGS_TIMEOUT_SECONDS:-4}
      SEARCH_MAX_ATTEMPTS: ${SEARCH_MAX_ATTEMPTS:-2}
      SEARCH_FALLBACK: ${SEARCH_FALLBACK:-true}
      SEARCH_BREAKER_FAILURES: ${SEARCH_BREAKER_FAILURES:-3}
      SEARCH_BREAKER_COOLDOWN_SECONDS: ${SEARCH_BREAKER_COOLDOWN_SECONDS:-60}
      SEARCH_MAX_BYTES: ${SEARCH_MAX_BYTES:-2097152}
      WEBTOOL_PROXY_URL: ${WEBTOOL_PROXY_URL:-}
      FETCH_TIMEOUT_SECONDS: ${FETCH_TIMEOUT_SECONDS:-45}
      FETCH_MAX_ATTEMPTS: ${FETCH_MAX_ATTEMPTS:-2}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-5242880}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      AUTH_COOKIE_SECONDS: ${AUTH_COOKIE_SECONDS:-34560000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-536870912}
      FETCH_MAX_CHARS: ${FETCH_MAX_CHARS:-50000}
      OFFICECLI_PATH: /app/vendor/officecli/linux-x64/officecli
      LIBREOFFICE_PATH: /usr/bin/libreoffice
      OFFICECLI_TIMEOUT_SECONDS: ${OFFICECLI_TIMEOUT_SECONDS:-60}
      LEGACY_CONVERSION_TIMEOUT_SECONDS: ${LEGACY_CONVERSION_TIMEOUT_SECONDS:-60}
      DOCUMENT_TOOL_TIMEOUT_SECONDS: ${DOCUMENT_TOOL_TIMEOUT_SECONDS:-120}
      DOCUMENT_TOOL_USER_CONCURRENCY: ${DOCUMENT_TOOL_USER_CONCURRENCY:-2}
      DOCUMENT_DRAFT_TTL_SECONDS: ${DOCUMENT_DRAFT_TTL_SECONDS:-1800}
      DOCUMENT_DRAFT_MAX_PER_USER: ${DOCUMENT_DRAFT_MAX_PER_USER:-10}
      DOCUMENT_DRAFT_USER_BYTES: ${DOCUMENT_DRAFT_USER_BYTES:-62914560}
    volumes:
      - api_data:/data
    # Lets WEBTOOL_PROXY_URL use host.docker.internal to reach a proxy on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s
    init: true
    security_opt:
      - no-new-privileges:true
    # LibreOffice needs room for its per-conversion profile plus input/output files.
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    name: matrius_prod_edge
    driver: bridge

volumes:
  api_data:
    name: matrius_prod_api_data
  caddy_data:
    name: matrius_prod_caddy_data
  caddy_config:
    name: matrius_prod_caddy_config
